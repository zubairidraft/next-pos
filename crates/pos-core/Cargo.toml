[package]
name = "pos-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
ulid.workspace = true
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
refinery = { version = "0.8", features = ["rusqlite"] }
log = "0.4"
argon2 = "0.5"
csv = "1.3"
base64 = "0.22"
calamine = "0.37"
getrandom = "0.2"
ed25519-dalek = "2.1"
sha2 = "0.10"
# Only for the browser test server (cargo run --features dev-server --bin pos-dev-server).
tiny_http = { version = "0.12", optional = true }
# Phone link (desktop app only): cargo build --features lan-hub
pos-lan = { path = "../pos-lan", features = ["server"], optional = true }
if-addrs = { version = "0.15", optional = true }

[features]
dev-server = ["dep:tiny_http", "dep:pos-lan"]
lan-hub = ["dep:pos-lan", "dep:if-addrs"]

[[bin]]
name = "pos-dev-server"
required-features = ["dev-server"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
pos-lan = { path = "../pos-lan", features = ["server"] }
proptest = "1.4"
tempfile = "3.10"
